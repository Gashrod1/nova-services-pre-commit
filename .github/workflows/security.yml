name: Contrôles qualité et sécurité

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer les dépendances de développement
        run: python -m pip install -r requirements-dev.txt

      - name: Exécuter tous les hooks pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
